    .cover-bg svg{width:min(92vw,1050px);opacity:.09}
    .slide.title-slide{overflow:hidden}
    .slide.title-slide>:not(.cover-bg){position:relative;z-index:1}

      letter-spacing:.3em;font-size:clamp(.82rem,1.6vw,1.1rem)}
    .slide h3{margin:.2rem 0 .45rem;font-size:clamp(1.05rem,2.4vw,1.45rem);color:var(--slide-text)}
    .muted{color:var(--slide-muted)} .danger{color:#f87171} .good{color:#34d399} .warn{color:#f5a623}
    .accent-text{color:var(--slide-accent)}
    .slide strong,.slide b{color:var(--slide-text)}
    .lead-in{margin-top:1.1rem;font-style:italic;color:var(--slide-text)}

    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.4rem 0}
    .three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1rem 0}
    .card{background:var(--slide-surface);border:1px solid rgba(139,156,179,.18);border-radius:12px;
      padding:1rem 1.2rem}
    .card p{margin:.3rem 0 0;font-size:clamp(.92rem,1.7vw,1.12rem)}
    .three-col .card{text-align:center;font-weight:600;color:var(--slide-text)}
    .tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;
      color:var(--slide-accent);font-weight:700;margin-bottom:.15rem}

    .big-q{font-size:clamp(1.6rem,4.2vw,3rem);line-height:1.22;max-width:24ch;margin:0 auto}
    .title-slide h1{max-width:22ch;margin-left:auto;margin-right:auto}

    .chat{background:#0b0f16;border:1px solid rgba(139,156,179,.2);border-radius:12px;
      padding:1rem 1.2rem;margin:.4rem 0;max-width:900px}
    .chat-row{display:flex;gap:.75rem;align-items:flex-start}
    .who{flex:0 0 auto;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--slide-accent);
      background:rgba(59,130,246,.12);border-radius:6px;padding:.25rem .5rem;font-weight:700;margin-top:.1rem}
    .chat p{margin:0;color:var(--slide-text);font-size:clamp(.95rem,1.8vw,1.2rem)}
    .note{color:var(--slide-muted);font-size:.9em;margin:.6rem 0 0}
    .attach{background:rgba(59,130,246,.15);border-radius:6px;padding:.1em .45em;color:var(--slide-accent);
      font-family:var(--slide-mono);font-size:.85em}
    ol.mini{margin:.5rem 0 0;padding-left:1.3rem} ol.mini li{color:var(--slide-text);margin-top:.25rem}

    .fab{border:1px solid rgba(248,113,113,.35);border-radius:12px;padding:1rem 1.25rem;
      background:rgba(248,113,113,.05);max-width:820px}
    .fab ul{margin:.2rem 0 .7rem} .fab li{color:var(--slide-text)}
    .fab-stamp{color:#f87171;font-weight:600;border-top:1px dashed rgba(248,113,113,.3);

    .tokens{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
    .tokens span{background:var(--slide-surface);border:1px solid rgba(59,130,246,.25);border-radius:6px;

    .rm-here{display:inline-block;margin-top:.4rem;font-size:.66rem;font-weight:800;color:var(--slide-accent);

    .rm-node.dim{opacity:.38;border-style:dashed}

    /* ===== Căn giữa toàn bộ slide dense (giữ list/bảng/chat/concept canh trái cho dễ đọc) ===== */

  <script>
    // Controller riêng buổi 03: điều hướng slide + "hỏi trước → trả lời sau" (.reveal).
    // Tương thích ngược: slide không có .reveal chạy y như controller _shared.
    (function () {
      const deck = document.getElementById("deck");
      if (!deck) return;
      const slides = [...deck.querySelectorAll(".slide")];
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const counter = document.getElementById("counter");
      const bar = document.getElementById("progress-bar");
      let cur = 0;

      const frags = (i) => [...slides[i].querySelectorAll(".reveal")];
      const shownIn = (i) => frags(i).filter((f) => f.classList.contains("shown")).length;

      function render() {
        slides.forEach((s, i) => s.classList.toggle("active", i === cur));
        if (prevBtn) prevBtn.disabled = cur === 0 && shownIn(cur) === 0;
        if (nextBtn) nextBtn.disabled = cur === slides.length - 1 && shownIn(cur) === frags(cur).length;
        if (counter) counter.textContent = `${cur + 1} / ${slides.length}`;
        if (bar) bar.style.width = `${((cur + 1) / slides.length) * 100}%`;
      }
      function next() {
        const f = frags(cur), shown = shownIn(cur);
        if (shown < f.length) { f[shown].classList.add("shown"); render(); return; }
        if (cur < slides.length - 1) { cur++; frags(cur).forEach((x) => x.classList.remove("shown")); render(); }
      }
      function prev() {
        if (shownIn(cur) > 0) { frags(cur)[shownIn(cur) - 1].classList.remove("shown"); render(); return; }
        if (cur > 0) { cur--; frags(cur).forEach((x) => x.classList.add("shown")); render(); }
      }
      function goto(i, revealAll) {
        cur = Math.max(0, Math.min(i, slides.length - 1));
        frags(cur).forEach((x) => x.classList.toggle("shown", !!revealAll));
        render();
      }

      prevBtn?.addEventListener("click", prev);
      nextBtn?.addEventListener("click", next);
      document.addEventListener("keydown", (e) => {
        switch (e.key) {
          case "ArrowRight": case "ArrowDown": case " ": case "PageDown":
            e.preventDefault(); next(); break;
          case "ArrowLeft": case "ArrowUp": case "PageUp":
            e.preventDefault(); prev(); break;
          case "Home": e.preventDefault(); goto(0, false); break;
          case "End": e.preventDefault(); goto(slides.length - 1, true); break;
        }
      });
      render();
    })();
  </script>
